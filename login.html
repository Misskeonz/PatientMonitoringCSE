<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #96bcb4;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s ease;
        }

        .container {
            width: 50%;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.4s ease-in-out;
        }

        .container:hover {
            background-color: #f1f1f1;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
        }

        h1, h2 {
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 20px; /* Adds vertical spacing between inputs */
        }

        input, button {
            width: 90%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid#91accb;
            display: block;
            margin: 0 auto;
        }

        button {
            background-color: #91accb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #8e5ca1;
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
         <!-- Logo Image -->
        <img src="philip.jpeg" alt="Philip Logo" class="logo">
       
        <h1>Philips Intellivue</h1>
        <h2>Login</h2>
        
        <form method="POST">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
